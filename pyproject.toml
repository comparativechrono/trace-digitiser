[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-digitiser"
version = "1.2.0"
description = "Template-free computer-vision digitisation pipeline for raster scientific line plots."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Trace Digitiser Contributors" }]
keywords = [
    "plot digitizer",
    "graph digitiser",
    "data extraction",
    "computer vision",
    "time series",
    "circadian",
    "actigraphy",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Image Processing",
]

dependencies = [
    "opencv-python-headless>=4.8",
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/comparativechrono/trace-digitiser"
Repository = "https://github.com/comparativechrono/trace-digitiser"
Issues = "https://github.com/comparativechrono/trace-digitiser/issues"
Changelog = "https://github.com/comparativechrono/trace-digitiser/blob/main/CHANGELOG.md"

[project.scripts]
trace-digitiser = "trace_digitiser.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 120
target-version = "py310"
