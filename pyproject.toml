[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-digitiser"
version = "2.1.0"
description = "Recover the data from figure images - lines, points, bars, actograms, heat maps - on your own computer: no uploads, no AI model."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Trace Digitiser Contributors" }]
keywords = [
    "plot digitizer",
    "graph digitiser",
    "data extraction",
    "data rescue",
    "computer vision",
    "time series",
    "circadian",
    "actigraphy",
    "actogram",
    "heat map",
    "scatter plot",
    "bar chart",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Image Processing",
]

dependencies = [
    "opencv-python-headless>=4.8",
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# Only for detect_trace_masks(..., use_lab=True), an alternative way of
# separating trace colours.
lab = [
    "scikit-learn>=1.2",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/comparativechrono/trace-digitiser"
Repository = "https://github.com/comparativechrono/trace-digitiser"
Issues = "https://github.com/comparativechrono/trace-digitiser/issues"
Changelog = "https://github.com/comparativechrono/trace-digitiser/blob/main/CHANGELOG.md"

[project.scripts]
trace-digitiser = "trace_digitiser.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Stated in full so that the result does not change with ruff's defaults.
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "B905",   # zip() without strict=: the lengths are equal by construction
    "UP007",  # Optional[...] and Union[...] are used throughout
    "UP045",
]
